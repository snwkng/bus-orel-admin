# CI: проверка сборки и сборка образа (пуш в GHCR) — на GitHub-hosted раннере,
# деплой (docker compose pull + up на VPS) — на self-hosted раннере.

name: bus-orel-admin

on:
  push:
    branches: ['main']
  # ручной запуск (Actions → Run workflow на main) — передеплой без пуша
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      # бинарник Cypress (~500 МБ) в CI-сборке не нужен — только для e2e
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run build

  build-image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ghcr.io/snwkng/bus-orel-admin:latest
            ghcr.io/snwkng/bus-orel-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: self-hosted
    permissions:
      packages: read
    concurrency:
      group: deploy-admin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Sync app dir
        run: |
          mkdir -p ~/apps/admin
          cp docker-compose.prod.yml ~/apps/admin/docker-compose.yml
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Deploy
        run: |
          cd ~/apps/admin
          docker compose pull
          docker compose up -d
      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
