# SPA на Vue Router (history-режим): все нефайловые пути → index.html.
# /api/ здесь не проксируется — это делает хостовый nginx (admin.bus-orel.conf).
server {
    listen 5174;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # хэшированные ассеты Vite — иммутабельный кэш
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
